<!DOCTYPE html>
<html lang="en" data-theme="midnight">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>भोजपुरी सुपरहिट गाने | Bhojpuri Hit Songs - पवन सिंह, खेसारी लाल यादव</title>
  <link rel="canonical" href="https://www.mahaparvchhathpuja.me/bhojpuri-songs/bhojpuri-songs.html">
  <link rel="stylesheet" href="festival-player.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.io/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon.io/favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="description" content="पवन सिंह, खेसारी लाल यादव, शिल्पी राज और मनोज तिवारी के ऑल-टाइम सुपरहिट भोजपुरी गाने, डीजे डांस और पारंपरिक लोकगीत 320 Kbps HD ऑडियो में सुनें।">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Outfit:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body data-songs-file="bhojpuri_songs.json" data-festival-title="Bhojpuri Songs">
  <!-- Navigation Header -->
  <header class="player-navbar">
    <div class="container navbar-inner">
      <a href="../home.html" class="btn-back-home" title="Go Home" aria-label="Go Home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Go Home</span>
      </a>

      <div class="page-title-badge" style="color: #fb923c;">
        <span>🪕</span>
        <span>भोजपुरी सुपरहिट गाने (Bhojpuri Hits)</span>
      </div>

      <div class="nav-right-actions">
        <div class="time-box">
          <span id="currentTime">--:-- --</span>
        </div>
        <button class="btn-theme" id="themeToggleBtn" type="button" title="Theme">🎨 Theme</button>
      </div>
    </div>
  </header>

  <!-- Main Player Layout -->
  <main class="container">
    <div class="player-page-grid">
      <!-- Left Audio Deck -->
      <section class="audio-deck-card">
        <!-- View Mode Switcher -->
        <button class="btn-view-toggle" id="viewToggleBtn" type="button" title="Switch to YouTube Video View">
          <span>🎬</span> <span>Video View</span>
        </button>

        <!-- Video Stage (YouTube Player) -->
        <div class="video-stage" id="videoStage">
          <div id="ytFestivalPlayer"></div>
        </div>

        <!-- Vinyl Record Disc -->
        <div class="vinyl-deck" id="vinylDisc" style="box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 20px rgba(249, 115, 22, 0.4);">
          <div class="vinyl-center-label" style="background: linear-gradient(135deg, #f97316, #e11d48);">
            <span style="font-size: 2rem;">🪕</span>
          </div>
        </div>

        <div class="deck-track-info">
          <span class="deck-tag" id="playerTrackTag" style="color: #fb923c;">⏳ जल्द आ रहा है</span>
          <h2 class="deck-title" id="playerTrackTitle">गाने जल्द आ रहे हैं</h2>
          <div class="deck-singer" id="playerTrackSinger">PlayX म्यूज़िक लाइब्रेरी</div>
        </div>

        <div class="deck-seek-wrap">
          <input type="range" class="seek-slider" id="playerSeekSlider" min="0" max="100" value="0">
          <div class="seek-time-row">
            <span id="playerCurrentTime">00:00</span>
            <span id="playerDuration">00:00</span>
          </div>
        </div>

        <div class="deck-controls-row">
          <button class="control-btn" id="playerShuffleBtn" type="button" title="Shuffle">🔀</button>
          <button class="control-btn" id="playerPrevBtn" type="button" title="Previous">⏮</button>
          <button class="control-btn btn-main-play" id="playerPlayBtn" type="button" title="Play/Pause" style="background: #f97316; color: #fff;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="control-btn" id="playerNextBtn" type="button" title="Next">⏭</button>
          <button class="control-btn" id="playerRepeatBtn" type="button" title="Repeat">🔁</button>
        </div>

        <div class="deck-extra-controls">
          <div class="volume-group">
            <button class="btn-mute" id="playerMuteBtn" type="button" title="Mute">🔊</button>
            <input type="range" class="volume-slider" id="playerVolumeSlider" min="0" max="100" value="85">
          </div>
          <button class="btn-speed" id="playerSpeedBtn" type="button" title="Speed">1x</button>
        </div>
      </section>

      <!-- Right Song Playlist Deck -->
      <section class="playlist-card">
        <div class="playlist-header">
          <h3>भोजपुरी गीत संकलन (<span id="playlistSongCount">0</span>)</h3>
          <div class="playlist-search-box">
            <input type="text" id="playlistSearchInput" placeholder="गाना या गायक खोजें...">
          </div>
        </div>

        <div class="song-items-list" id="playlistContainer">
          <!-- Dynamic Song Rows -->
        </div>
      </section>
    </div>
  </main>

  <script src="festival-player.js"></script>
</body>

</html>
