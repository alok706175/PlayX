<!DOCTYPE html>
<html lang="en" data-theme="midnight">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haryanvi Hit Songs | Top DJ & Folk Tracks - PlayX</title>
  <link rel="canonical" href="https://www.mahaparvchhathpuja.me/haryanvi-songs/haryanvi-songs.html">
  <link rel="stylesheet" href="festival-player.css">
  <link rel="icon" type="image/svg+xml" href="images/haryanvi_logo.svg">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="description" content="Listen to all-time hit Haryanvi DJ songs, dance numbers, and bass-boosted tracks in 320 Kbps HD audio on PlayX.">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Outfit:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body data-songs-file="haryanvi_songs.json" data-festival-title="Haryanvi Songs">
  <!-- Navigation Header -->
  <header class="player-navbar">
    <div class="container navbar-inner">
      <a href="../home.html" class="btn-back-home" title="Go Home" aria-label="Go Home">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Go Home</span>
      </a>

      <div class="page-title-badge" style="color: #ec4899; display: inline-flex; align-items: center; gap: 8px;">
        <img src="images/haryanvi_logo.svg" alt="Haryanvi Hits Logo" style="width: 36px; height: 36px; object-fit: contain; vertical-align: middle; filter: drop-shadow(0 0 10px rgba(236, 72, 153, 0.5));">
        <span>Haryanvi Hit Songs</span>
      </div>

      <div class="nav-right-actions">
        <div class="time-box">
          <span id="currentTime">--:-- --</span>
        </div>
        <button class="btn-theme" id="themeToggleBtn" type="button" title="Theme">🎨 Theme</button>
      </div>
    </div>
  </header>

  <!-- Main Player Layout -->
  <main class="container">
    <div class="player-page-grid">
      <!-- Left Audio Deck -->
      <section class="audio-deck-card">
        <!-- View Mode Switcher -->
        <button class="btn-view-toggle" id="viewToggleBtn" type="button" title="Switch to YouTube Video View">
          <span>🎬</span> <span>Video View</span>
        </button>

        <!-- Video Stage (YouTube Player) -->
        <div class="video-stage" id="videoStage">
          <div id="ytFestivalPlayer"></div>
        </div>

        <!-- Vinyl Record Disc -->
        <div class="vinyl-deck" id="vinylDisc" style="box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(236, 72, 153, 0.45), 0 0 45px rgba(168, 85, 247, 0.35);">
          <div class="vinyl-center-label" style="background: #09091f; border: 2px solid rgba(255, 255, 255, 0.15);">
            <img src="images/haryanvi_logo.svg" alt="Haryanvi Music Disc" style="width: 100%; height: 100%; object-fit: contain; padding: 4px; transform: scale(1.15);">
          </div>
        </div>

        <div class="deck-track-info">
          <span class="deck-tag" id="playerTrackTag" style="color: #ec4899;">⏳ Coming Soon</span>
          <h2 class="deck-title" id="playerTrackTitle">Songs Coming Soon</h2>
          <div class="deck-singer" id="playerTrackSinger">PlayX Music Library</div>
        </div>

        <div class="deck-seek-wrap">
          <input type="range" class="seek-slider" id="playerSeekSlider" min="0" max="100" value="0">
          <div class="seek-time-row">
            <span id="playerCurrentTime">00:00</span>
            <span id="playerDuration">00:00</span>
          </div>
        </div>

        <div class="deck-controls-row">
          <button class="control-btn" id="playerShuffleBtn" type="button" title="Shuffle">🔀</button>
          <button class="control-btn" id="playerPrevBtn" type="button" title="Previous">⏮</button>
          <button class="control-btn btn-main-play" id="playerPlayBtn" type="button" title="Play/Pause" style="background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="control-btn" id="playerNextBtn" type="button" title="Next">⏭</button>
          <button class="control-btn" id="playerRepeatBtn" type="button" title="Repeat">🔁</button>
        </div>

        <div class="deck-extra-controls">
          <div class="volume-group">
            <button class="btn-mute" id="playerMuteBtn" type="button" title="Mute">🔊</button>
            <input type="range" class="volume-slider" id="playerVolumeSlider" min="0" max="100" value="85">
          </div>
          <button class="btn-speed" id="playerSpeedBtn" type="button" title="Speed">1x</button>
        </div>
      </section>

      <!-- Right Song Playlist Deck -->
      <section class="playlist-card">
        <div class="playlist-header">
          <h3>Haryanvi Songs Collection (<span id="playlistSongCount">0</span>)</h3>
          <div class="playlist-search-box">
            <input type="text" id="playlistSearchInput" placeholder="Search songs or singers...">
          </div>
        </div>

        <div class="song-items-list" id="playlistContainer">
          <!-- Dynamic Song Rows -->
        </div>
      </section>
    </div>
  </main>

  <script src="festival-player.js"></script>
</body>

</html>
