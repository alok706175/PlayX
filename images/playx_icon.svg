<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant PlayX Pink to Purple Gradient -->
    <linearGradient id="playxGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="25%" stop-color="#e91e63"/>
      <stop offset="60%" stop-color="#9c27b0"/>
      <stop offset="100%" stop-color="#6a1b9a"/>
    </linearGradient>

    <!-- Music Note Gradient -->
    <linearGradient id="noteGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ba68c8"/>
      <stop offset="40%" stop-color="#8e24aa"/>
      <stop offset="100%" stop-color="#512da8"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e91e63"/>
      <stop offset="50%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>

    <!-- Glossy White Highlight Curve -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="playxShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8e24aa" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#playxShadow)">
    <!-- 1. CRESCENT VINYL RECORD / DISC (LEFT & BOTTOM ARC) -->
    <path d="M 235 155
             C 145 155, 120 220, 120 280
             C 120 375, 195 440, 290 440
             C 325 440, 355 430, 375 415
             C 355 410, 335 395, 325 375
             C 310 390, 280 400, 250 400
             C 175 400, 160 340, 160 285
             C 160 225, 195 190, 240 190
             C 245 190, 250 190, 255 191
             L 255 155
             Z" 
          fill="url(#playxGradient)"/>

    <!-- Left Glossy Shine Highlight on Vinyl Edge -->
    <path d="M 152 235
             C 138 275, 142 320, 160 355
             C 152 325, 150 280, 165 240
             C 178 205, 205 180, 235 170
             C 200 178, 168 200, 152 235 Z"
          fill="url(#shineGradient)"/>

    <!-- 2. MUSICAL EIGHTH NOTE (QUAVER) -->
    <!-- Note Head (Circle/Ellipse in Center) -->
    <ellipse cx="240" cy="295" rx="38" ry="32" transform="rotate(-20 240 295)" fill="url(#noteGradient)"/>

    <!-- Note Stem -->
    <path d="M 264 285
             L 264 125
             C 264 110, 275 100, 290 95
             L 305 90
             L 305 110
             L 282 118
             L 282 278
             Z" 
          fill="url(#noteGradient)"/>

    <!-- Note Flag / Banner -->
    <path d="M 285 92
             C 340 115, 365 170, 345 235
             C 342 245, 330 245, 330 235
             C 335 185, 320 145, 285 125
             Z" 
          fill="url(#noteGradient)"/>

    <!-- 3. SOUND WAVE RIPPLES (BOTTOM-RIGHT CONCENTRIC ARCS) -->
    <!-- Inner Ripple -->
    <path d="M 290 315
             A 55 55 0 0 1 345 370" 
          fill="none" stroke="url(#waveGradient)" stroke-width="14" stroke-linecap="round"/>

    <!-- Middle Ripple -->
    <path d="M 310 285
             A 95 95 0 0 1 405 380" 
          fill="none" stroke="url(#waveGradient)" stroke-width="14" stroke-linecap="round"/>

    <!-- Outer Ripple -->
    <path d="M 330 255
             A 135 135 0 0 1 465 390" 
          fill="none" stroke="url(#waveGradient)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
