<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realistic Hanging Light-Bulb Transition Preview</title>
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="dark-light-mode.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      transition: background-color 0.4s ease, color 0.4s ease;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .demo-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
    }
    .demo-btn {
      margin-top: 24px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--border-glow);
      background: linear-gradient(135deg, rgba(255,184,0,0.2), rgba(255,87,34,0.2));
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .demo-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,184,0,0.3);
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <h2>Realistic Hanging Light Bulb Transition</h2>
    <p>Click the toggle button below or in the top navigation to trigger the physical incandescent bulb animation.</p>
    <button class="demo-btn theme-toggle-btn" id="themeToggleBtn" type="button">
      <svg class="btn-nav-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <span id="themeBtnText">Toggle Theme</span>
    </button>
  </div>

  <script src="dark-light-mode.js"></script>
  <script>
    const btn = document.getElementById("themeToggleBtn");
    btn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") || "dark";
      const target = current === "dark" ? "light" : "dark";
      window.BulbThemeTransition.trigger({
        targetTheme: target,
        toggleBtn: btn,
        onApplyTheme: () => {
          document.documentElement.setAttribute("data-theme", target);
          document.getElementById("themeBtnText").textContent = target === "dark" ? "Dark Mode" : "Light Mode";
        }
      });
    });
  </script>
</body>
</html>
